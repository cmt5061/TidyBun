// ── Helpers ───────────────────────────────────────────────────────
function weekNum(d){
  const utc=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const jan1=Date.UTC(d.getFullYear(),0,1);
  const days=Math.floor((utc-jan1)/86400000);
  return Math.ceil((days+new Date(jan1).getUTCDay()+1)/7);
}
function mkPid(freq,d=new Date()){
  if(freq==="monthly") return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(freq==="weekly")  return d.getFullYear()+"-W"+String(weekNum(d)).padStart(2,"0");
  return String(d.getFullYear());
}
function fmtP(p){
  if(p.length===4) return p;
  if(p.includes("-W")){const[y,w]=p.split("-W");return "Week "+w+", "+y;}
  const [y,m]=p.split("-");
  return new Date(y,m-1).toLocaleString("default",{month:"long",year:"numeric"});
}
function uid(){return Math.random().toString(36).slice(2,10);}
function genKey(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ",N="23456789";
  const a=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join("");
  const n=Array.from({length:4},()=>N[Math.floor(Math.random()*N.length)]).join("");
  return a+"-"+n;
}
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function getCurSeason(){
  const m=new Date().getMonth()+1;
  return SEASONS.find(s=>s.months.includes(m))||SEASONS[0];
}
function getSchedPill(chore){
  const curM=new Date().getMonth()+1;
  const curSeason=getCurSeason();
  if(chore.targetMonth){
    const isCur=chore.targetMonth===curM;
    return {label:MONTHS[chore.targetMonth-1],isCur,col:isCur?BRAND.coral:"#888"};
  }
  if(chore.targetSeason){
    const s=SEASONS.find(x=>x.id===chore.targetSeason);
    if(!s) return null;
    const isCur=s.id===curSeason.id;
    return {label:s.emoji+" "+s.label,isCur,col:isCur?s.col:"#888"};
  }
  return null;
}

// ── Firebase ──────────────────────────────────────────────────────
async function cloudSave(dbUrl,syncKey,data){
  const url=dbUrl.replace(/[/]$/,"")+"/households/"+syncKey+".json";
  const res=await fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!res.ok) throw new Error("HTTP "+res.status);
}
async function cloudLoad(dbUrl,syncKey){
  const url=dbUrl.replace(/[/]$/,"")+"/households/"+syncKey+".json";
  const res=await fetch(url);
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}

    border:"1.5px solid var(--border)",background:"var(--bg1)",
    color:"var(--text1)",fontSize:15,fontFamily:"inherit",outline:"none",resize:"none"};
  if(multi) return <textarea rows={3} value={value} onChange={onChange} placeholder={placeholder} style={s}/>;
  return <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={s}/>;
}

function Btn({children,onClick,disabled,full,color,sm}){

function SchedPill({chore}){

}

function SyncBadge({status}){
  const MAP={
    offline:null,
    idle:   {col:"#5A9E6F",label:"Synced"},
    saving: {col:"#D4A017",label:"Saving…"},
    saved:  {col:"#5A9E6F",label:"Saved!"},
    error:  {col:"#E8735A",label:"Sync error"},
  };
  const c=MAP[status];
  if(!c) return null;
  return (
    <div title={c.label} style={{display:"flex",alignItems:"center",gap:5,
      padding:"3px 9px",borderRadius:99,background:"var(--bg3)",flexShrink:0}}>
      <div style={{width:7,height:7,borderRadius:99,background:c.col,
        boxShadow:"0 0 0 2px "+c.col+"44",
        animation:status==="saving"?"pulse 1.2s infinite ease-in-out":"none"}}/>
      <span style={{fontSize:10,fontWeight:700,color:c.col}}>{c.label}</span>
    </div>
  );
}

function Home({chores,cats,comps,setComps,darkMode,setDarkMode,isWide,members,activeMId,syncSt}){
  const now=new Date();
  const mp=mkPid("monthly"),yp=mkPid("yearly"),wp=mkPid("weekly");
  const [freqF,setFreqF]=useState(null);  // null=all  "monthly"  "yearly"
  const [catF,setCatF]=useState(null);    // null=all  or catId
  const [search,setSearch]=useState("");
  const hr=now.getHours();
  const greeting=hr<12?"Good Morning, Buns":hr<17?"Good Afternoon, Buns":"Good Evening, Buns";

  const toggleFreq=f=>setFreqF(p=>p===f?null:f);
  const toggleCatF=id=>setCatF(p=>p===id?null:id);
  const clearAll=()=>{setFreqF(null);setCatF(null);};
  const isDone=(cid,p)=>comps.some(c=>c.choreId===cid&&c.periodId===p&&c.completed);
  const toggleChore=(cid,p)=>{
    const mName=(members.find(m=>m.id===activeMId)||{}).name||"";
    const ex=comps.find(c=>c.choreId===cid&&c.periodId===p);
    if(ex) setComps(prev=>prev.map(c=>c.choreId===cid&&c.periodId===p
      ?{...c,completed:!c.completed,completedAt:Date.now(),completedBy:!c.completed?mName:c.completedBy}:c));
    else setComps(prev=>[...prev,{id:uid(),choreId:cid,periodId:p,completed:true,completedAt:Date.now(),completedBy:mName}]);
  };

  const active=chores.filter(c=>c.active);
  const activeCats=cats.filter(c=>c.active);
  const filtered=active.filter(ch=>{
    const mF=!freqF||ch.frequency===freqF;
    const mC=!catF||ch.categoryId===catF;
    const mS=!search||ch.title.toLowerCase().includes(search.toLowerCase());
    return mF&&mC&&mS;
  });
  const weekly=filtered.filter(c=>c.frequency==="weekly");
  const monthly=filtered.filter(c=>c.frequency==="monthly");
  const yearly=filtered.filter(c=>c.frequency==="yearly");
  const wDoneShown=weekly.filter(c=>isDone(c.id,wp)).length;
  const mDoneShown=monthly.filter(c=>isDone(c.id,mp)).length;
  const yDoneShown=yearly.filter(c=>isDone(c.id,yp)).length;
  const allW=active.filter(c=>c.frequency==="weekly");
  const allM=active.filter(c=>c.frequency==="monthly");
  const allY=active.filter(c=>c.frequency==="yearly");
  const wDone=allW.filter(c=>isDone(c.id,wp)).length;
  const mDone=allM.filter(c=>isDone(c.id,mp)).length;
  const yDone=allY.filter(c=>isDone(c.id,yp)).length;
  const total=allW.length+allM.length+allY.length;
  const done=wDone+mDone+yDone;
  const pct=total?Math.round((done/total)*100):0;

  const catStats=activeCats.map(cat=>{
    const cc=freqF
      ? active.filter(c=>c.categoryId===cat.id&&c.frequency===freqF)
      : active.filter(c=>c.categoryId===cat.id);
    const dn=cc.filter(c=>isDone(c.id,c.frequency==="monthly"?mp:c.frequency==="weekly"?wp:yp)).length;
    return {...cat,total:cc.length,done:dn};
  }).filter(c=>c.total>0);

  function groupByCat(list){
    const out=[];
    activeCats.forEach(cat=>{
      const cs=list.filter(c=>c.categoryId===cat.id);
      if(cs.length) out.push({cat,cs});
    });
    const known=activeCats.map(c=>c.id);
    const unk=list.filter(c=>!known.includes(c.categoryId));
    if(unk.length) out.push({cat:{id:"_",name:"Other",color:"blue",icon:"📦"},cs:unk});
    return out;
  }

  function ChoreRow({chore,p}){
    const dn=isDone(chore.id,p);
    const cat=cats.find(c=>c.id===chore.categoryId);
    const col=(cat&&CC[cat.color])||CC.blue;
    return (
      <div onClick={()=>toggleChore(chore.id,p)} style={{
        display:"flex",alignItems:"center",gap:10,padding:"10px 0",
        borderBottom:"1px solid var(--border)",opacity:dn?.55:1,transition:"opacity .2s",
      }}>
        <div style={{width:22,height:22,borderRadius:6,flexShrink:0,transition:"all .2s",
          border:dn?"none":"2px solid "+col.bg,background:dn?col.bg:"transparent",
          display:"flex",alignItems:"center",justifyContent:"center"}}>
          {dn&&<span style={{color:"#fff",fontSize:13}}>✓</span>}
        </div>
        <div style={{flex:1,minWidth:0}}>

            textDecoration:dn?"line-through":"none",display:"flex",alignItems:"center",

            overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{chore.notes}</div>}
        </div>
      </div>
    );
  }

  function CatGroup({cat,cs,period}){
    const col=(CC[cat.color])||CC.blue;
    const dn=cs.filter(c=>isDone(c.id,period)).length;
    return (
      <div style={{marginBottom:18}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
          paddingBottom:5,marginBottom:2,borderBottom:"2px solid "+col.bg}}>

            <span style={{fontSize:14}}>{cat.icon}</span>

        </div>
        {cs.map(c=><ChoreRow key={c.id} chore={c} p={c.frequency==="monthly"?mp:yp}/>)}
      </div>
    );
  }

  const wGroups=groupByCat(weekly);
  const mGroups=groupByCat(monthly);
  const yGroups=groupByCat(yearly);

  return (
    <div style={{paddingBottom:isWide?0:88}}>
      <div style={{padding:isWide?"20px 24px 0":"16px 20px 0",position:"sticky",
        top:0,background:"var(--bg1)",zIndex:10}}>

        {/* ── Frequency filter cards (All / Monthly / Yearly) ── */}
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          {[

            {id:"weekly", label:"Weekly", count:wDone, total:allW.length, color:BRAND.green, isActive:freqF==="weekly",   onClick:()=>toggleFreq("weekly")},
            {id:"monthly",label:"Monthly",count:mDone, total:allM.length, color:BRAND.coral, isActive:freqF==="monthly", onClick:()=>toggleFreq("monthly")},
            {id:"yearly", label:"Yearly", count:yDone, total:allY.length, color:BRAND.slate, isActive:freqF==="yearly",  onClick:()=>toggleFreq("yearly")},
          ].map(card=>(

                color:card.isActive?card.color:"var(--text2)"}}>{card.label}</div>
              <div style={{fontSize:16,fontWeight:900,lineHeight:1,marginBottom:6,
                color:card.isActive?card.color:"var(--text1)"}}>{card.count}/{card.total}</div>

          ))}
        </div>

        {/* ── Category filter cards ── */}
        {catStats.length>0&&(
          <div style={{display:"flex",gap:8,overflowX:"auto",scrollbarWidth:"none",
            marginBottom:10,paddingBottom:2}}>
            {/* All-categories card */}
            <div onClick={()=>setCatF(null)} style={{

                  <span style={{fontSize:9,fontWeight:700,marginTop:2,

}

// ── History ───────────────────────────────────────────────────────
function History({chores,comps,cats,isWide,members}){
  const now=new Date();
  const [tab,setTab]=useState("monthly");
  const periods=[];
  if(tab==="weekly"){
    for(let i=0;i<8;i++){
      const d=new Date(); d.setDate(d.getDate()-i*7);
      periods.push(mkPid("weekly",d));
    }
  } else if(tab==="monthly"){
    for(let i=0;i<6;i++){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      periods.push(mkPid("monthly",d));
    }
  } else {
    for(let i=0;i<5;i++) periods.push(String(now.getFullYear()-i));
  }
  const [sel,setSel]=useState(periods[0]);
  const freq=tab;
  const fchores=chores.filter(c=>c.active&&c.frequency===freq);
  const isDone=cid=>comps.some(c=>c.choreId===cid&&c.periodId===sel&&c.completed);
  const getComp=cid=>comps.find(c=>c.choreId===cid&&c.periodId===sel&&c.completed);
  const doneCount=fchores.filter(c=>isDone(c.id)).length;
  const activeCats=cats.filter(c=>c.active);
  const groups=activeCats.map(cat=>{
    const cs=fchores.filter(c=>c.categoryId===cat.id);
    return cs.length?{cat,cs}:null;
  }).filter(Boolean);

  return (
    <div style={{paddingBottom:isWide?0:88}}>
      <PgHeader title="History" showLogo={!isWide}/>
      <div style={{
        display:"flex",borderBottom:"1px solid var(--border)",
        padding:isWide?"0 24px":"0 20px",background:"var(--bg1)",
      }}>
        {["weekly","monthly","yearly"].map(t=>(
          <button key={t}
            onClick={()=>{setTab(t);setSel(t==="weekly"?mkPid("weekly"):t==="monthly"?periods[0]:String(now.getFullYear()));}}
            style={{
              padding:"11px 18px",border:"none",fontFamily:"inherit",cursor:"pointer",
              fontWeight:700,fontSize:14,background:"transparent",
              color:tab===t?BRAND.coral:"var(--text2)",
              borderBottom:tab===t?"2.5px solid "+BRAND.coral:"2.5px solid transparent",

            }}>
            {t.charAt(0).toUpperCase()+t.slice(1)}
          </button>
        ))}
      </div>
      <div style={{padding:isWide?"16px 24px":"16px 20px"}}>
        {/* Period pills */}
        <div style={{display:"flex",gap:8,overflowX:"auto",marginBottom:16,
          scrollbarWidth:"none",paddingBottom:4}}>
          {periods.map(p=>{
            const pFchores=chores.filter(c=>c.active&&c.frequency===freq);
            const pDone=pFchores.filter(c=>comps.some(x=>x.choreId===c.id&&x.periodId===p&&x.completed)).length;
            return (
              <button key={p} onClick={()=>setSel(p)} style={{
                flexShrink:0,padding:"9px 14px",borderRadius:14,border:"1.5px solid",
                borderColor:sel===p?BRAND.slate:"var(--border)",
                background:sel===p?BRAND.slate:"var(--bg2)",
                color:sel===p?"#fff":"var(--text2)",
                fontWeight:600,fontSize:12,fontFamily:"inherit",minWidth:100,textAlign:"center",
              }}>
                <div style={{fontWeight:700}}>{fmtP(p)}</div>
                <div style={{fontSize:11,opacity:.8,marginTop:2}}>{pDone}/{pFchores.length} done</div>
              </button>
            );
          })}
        </div>
        {/* Summary bar */}
        <div style={{background:"var(--bg2)",borderRadius:16,padding:"14px 16px",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontWeight:700,color:"var(--text1)",fontSize:15}}>{fmtP(sel)}</span>
            <span style={{fontSize:13,fontWeight:700,color:BRAND.coral}}>{doneCount}/{fchores.length} completed</span>
          </div>
          <Bar value={fchores.length?(doneCount/fchores.length)*100:0} color={BRAND.coral}/>
        </div>
        {/* Grouped chores */}
        {groups.length===0?(
          <div style={{textAlign:"center",padding:"40px 0"}}>
            <Logo size={60} style={{opacity:.6}}/>
            <p style={{color:"var(--text3)",marginTop:12}}>Nothing to show for this period.</p>
          </div>
        ):groups.map(({cat,cs})=>{
          const col=(CC[cat.color])||CC.blue;
          return (
            <div key={cat.id} style={{marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,
                paddingBottom:5,borderBottom:"2px solid "+col.bg}}>

              </div>
              {cs.map(chore=>{

                        {chore.title}

                        <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>

// ── Categories ────────────────────────────────────────────────────
function Categories({cats,setCats,chores,isWide}){
  const [adding,setAdding]=useState(false);
  const [editing,setEditing]=useState(null);

  const openEdit=c=>{setForm({name:c.name,color:c.color,icon:c.icon});setEditing(c);setAdding(true);};

    if(!form.name.trim()) return;
    if(editing) setCats(prev=>prev.map(c=>c.id===editing.id?{...c,...form}:c));
    else setCats(prev=>[...prev,{id:uid(),...form,active:true}]);

    <div style={{paddingBottom:isWide?0:88}}>

        right={<button onClick={openAdd} style={{background:BRAND.slate,color:"#fff",border:"none",

      <div style={{padding:isWide?"16px 24px":"16px 20px"}}>
        <div style={{position:"relative",marginBottom:16}}>
          <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",
            fontSize:14,color:"var(--text3)"}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Search categories…" style={{width:"100%",padding:"9px 14px 9px 34px",
              borderRadius:12,border:"1.5px solid var(--border)",background:"var(--bg2)",
              color:"var(--text1)",fontSize:14,fontFamily:"inherit",outline:"none"}}/>

          gap:12,marginBottom:24}}>

              <div key={cat.id} style={{background:"var(--bg2)",borderRadius:16,padding:"16px",

                <div style={{width:42,height:42,borderRadius:13,background:col.bg,

                <div style={{fontSize:12,color:"var(--text3)",marginBottom:12}}>{cnt} chore{cnt!==1?"s":""}</div>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>openEdit(cat)} style={{background:"var(--bg3)",border:"none",
                    borderRadius:8,padding:"5px 10px",fontSize:12,fontWeight:600,
                    color:"var(--text2)",fontFamily:"inherit"}}>Edit</button>

            <Inp value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Category name"/>
          </Fld>

            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

// ── Chores Screen ─────────────────────────────────────────────────
function ChoresScreen({chores,setChores,cats,isWide}){

    if(editing) setChores(prev=>prev.map(c=>c.id===editing.id?{...c,...form}:c));

  };

    const cat=cats.find(c=>c.id===chore.categoryId);

      <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,color:"var(--text1)",fontSize:14,

            {chore.title}
            {chore.frequency==="yearly"&&<SchedPill chore={chore}/>}
          </div>
          <div style={{fontSize:12,color:"var(--text3)",marginTop:2}}>
            {cat?cat.icon+" "+cat.name:"Unknown"} · {chore.frequency}
          </div>
        </div>
        <button onClick={()=>{setEditing(chore);setAdding(true);}} style={{
          background:"none",border:"none",fontSize:18,padding:4}}>✏️</button>
        <button onClick={()=>toggleA(chore.id)} style={{
          background:"none",border:"none",fontSize:18,padding:4}}>
          {chore.active?"🗃️":"♻️"}
        </button>
      </div>
    );
  }
  const active=chores.filter(c=>c.active);
  const archived=chores.filter(c=>!c.active);
  return (

      <PgHeader title="Chores" showLogo={!isWide}
        right={<button onClick={()=>{setEditing(null);setAdding(true);}} style={{
          background:BRAND.slate,color:"#fff",border:"none",borderRadius:12,
          padding:"8px 16px",fontWeight:700,fontSize:14,fontFamily:"inherit"}}>+ Add Chore</button>}
      />
      <div style={{padding:isWide?"16px 24px":"16px 20px"}}>
        {active.length===0&&archived.length===0&&(
          <div style={{textAlign:"center",padding:"60px 0"}}>
            <Logo size={80} style={{opacity:.7,marginBottom:16}}/>
            <p style={{color:"var(--text2)",fontWeight:600,margin:"0 0 6px"}}>TidyBun is ready to help!</p>
            <p style={{color:"var(--text3)",fontSize:14}}>Create your first chore to get started.</p>
          </div>
        )}
        {active.map(c=><Item key={c.id} chore={c}/>)}
        {archived.length>0&&<>
          <p style={{fontSize:12,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",
            letterSpacing:".07em",marginTop:16,marginBottom:8}}>Archived</p>
          {archived.map(c=><Item key={c.id} chore={c}/>)}
        </>}
      </div>
      {adding&&<ChoreModal cats={cats} editing={editing} onSave={doSave}
        onClose={()=>{setAdding(false);setEditing(null);}}/>}
    </div>
  );
}

// ── Settings ──────────────────────────────────────────────────────
const FIREBASE_RULES = `{
  "rules": {
    "households": {
      "$syncKey": {
        ".read": "$syncKey.matches(/^[A-Z]{4}-[0-9]{4}$/)",
        ".write": "$syncKey.matches(/^[A-Z]{4}-[0-9]{4}$/)"
      }
    },
    "$other": {
      ".read": false,
      ".write": false
    }
  }
}`;

const SETUP_STEPS = [
  {n:"1",title:"Create a Firebase project",body:'Go to console.firebase.google.com → Click "Add project" → Enter a name (e.g. "TidyBun") → Continue through the setup wizard.'},
  {n:"2",title:"Create a Realtime Database",body:'In your project, go to Build → Realtime Database → Click "Create Database" → Choose a region → Start in test mode (we\'ll add proper rules next).'},
  {n:"3",title:"Apply the security rules",body:'In the Realtime Database console, click the "Rules" tab → Replace the contents with the rules shown below → Click "Publish".'},
  {n:"4",title:"Copy your database URL",body:'In the Realtime Database "Data" tab, copy the URL at the top — it looks like:\nhttps://your-project-rtdb.firebaseio.com\nPaste it into the field above and click Save.'},
  {n:"5",title:"Sync across devices",body:'Share your Household Sync Key with family members. On their device, they enter the same Firebase URL and your sync key in "Load from Another Device" to join your household.'},
];

function Settings({syncKey,setSyncKey,darkMode,setDarkMode,members,setMembers,
  activeMId,setActiveMId,isWide,fbUrl,setFbUrl,cats,chores,comps,setCats,setChores,setComps,syncSt,setSyncSt}){
  const [copied,setCopied]=useState(false);
  const [addingM,setAddingM]=useState(false);
  const [editingM,setEditingM]=useState(null);
  const [mName,setMName]=useState("");
  const [loadKey,setLoadKey]=useState("");
  const [showGuide,setShowGuide]=useState(false);
  const [rulesCopied,setRulesCopied]=useState(false);
  const copyRules=()=>{navigator.clipboard&&navigator.clipboard.writeText(FIREBASE_RULES).catch(()=>{});setRulesCopied(true);setTimeout(()=>setRulesCopied(false),2000);};
  const [fbDraft,setFbDraft]=useState(fbUrl);
  const [syncMsg,setSyncMsg]=useState("");
  const [busy,setBusy]=useState(false);

  const copy=()=>{navigator.clipboard&&navigator.clipboard.writeText(syncKey).catch(()=>{});setCopied(true);setTimeout(()=>setCopied(false),2000);};
  const msg=(m,t=3500)=>{setSyncMsg(m);setTimeout(()=>setSyncMsg(""),t);};

  const saveMember=()=>{
    if(!mName.trim()) return;
    if(editingM){
      setMembers(prev=>prev.map(m=>m.id===editingM.id?{...m,name:mName.trim()}:m));
    } else {
      const nm={id:uid(),name:mName.trim()};
      setMembers(prev=>[...prev,nm]);
      if(!activeMId){setActiveMId(nm.id);save("tb_activeM",nm.id);}
    }
    setAddingM(false);setEditingM(null);setMName("");
  };
  const delMember=id=>{
    setMembers(prev=>prev.filter(m=>m.id!==id));
    if(activeMId===id){
      const next=(members.find(m=>m.id!==id)||{}).id||"";
      setActiveMId(next);save("tb_activeM",next);
    }
  };
  const saveFbUrl=()=>{setFbUrl(fbDraft);save("tb_fbUrl",fbDraft);msg("✓ URL saved.");};

  const doCloudSave=async()=>{
    if(!fbUrl){msg("⚠️ Enter Firebase URL first.");return;}
    setBusy(true);setSyncSt("saving");msg("Saving to cloud…",8000);
    try{
      await cloudSave(fbUrl,syncKey,{cats,chores,comps,members});
      setSyncSt("saved");setTimeout(()=>setSyncSt("idle"),2500);
      msg("✓ Saved to cloud!");
    }catch(e){msg("✗ "+e.message);setSyncSt("error");}
    setBusy(false);
  };
  const doCloudLoad=async()=>{
    const k=loadKey.trim()||syncKey;
    if(!fbUrl){msg("⚠️ Enter Firebase URL first.");return;}
    setBusy(true);setSyncSt("saving");msg("Loading from cloud…",8000);
    try{
      const data=await cloudLoad(fbUrl,k);
      if(!data){msg("✗ No data found for that key.");setBusy(false);setSyncSt("idle");return;}
      if(data.cats)    setCats(data.cats);
      if(data.chores)  setChores(data.chores);
      if(data.comps)   setComps(data.comps);
      if(data.members) setMembers(data.members);
      if(loadKey.trim()&&loadKey.trim()!==syncKey){setSyncKey(loadKey.trim());save("tb_synckey",loadKey.trim());}
      setSyncSt("saved");setTimeout(()=>setSyncSt("idle"),2500);
      msg("✓ Household loaded!");
    } catch(e){msg("✗ "+e.message);setSyncSt("error");}
    setBusy(false);
  };

  const Card=({children,style={}})=>(
    <div style={{background:"var(--bg2)",borderRadius:20,padding:"20px",marginBottom:14,...style}}>
      {children}
    </div>
  );
  const SL=({children})=>(

        <div style={{textAlign:"center",paddingTop:8,paddingBottom:32}}>

          onClose={()=>{setAddingM(false);setEditingM(null);setMName("");}}>
          <Fld label="Name">

  const [key,setKey]=useState("");
  const [err,setErr]=useState("");
  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",
      alignItems:"center",justifyContent:"center",padding:32,background:"var(--bg1)"}}>
      <Logo size={120} style={{marginBottom:20,boxShadow:"0 8px 32px rgba(61,90,128,.2)"}}/>
      <h1 style={{margin:0,fontSize:40,fontWeight:900,letterSpacing:"-.03em",fontFamily:"Georgia,serif"}}>
        <span style={{color:BRAND.slate}}>Tidy</span><span style={{color:BRAND.coral}}>Bun</span>
      </h1>
      <p style={{margin:"10px 0 44px",color:"var(--text2)",fontSize:15,
        textAlign:"center",lineHeight:1.6}}>
        Keep your household running smoothly,<br/>together.
      </p>
      {!joining?(
        <div style={{width:"100%",maxWidth:320,display:"flex",flexDirection:"column",gap:12}}>
          <Btn full color={BRAND.slate} onClick={onCreate}>Create Household</Btn>
          <button onClick={()=>setJoining(true)} style={{
            padding:"13px 24px",borderRadius:14,border:"1.5px solid var(--border)",
            background:"transparent",color:"var(--text1)",fontSize:16,
            fontWeight:700,fontFamily:"inherit"}}>Join Household</button>
        </div>
      ):(
        <div style={{width:"100%",maxWidth:320}}>
          <p style={{margin:"0 0 12px",color:"var(--text2)",textAlign:"center"}}>Enter your household sync key</p>
          <Inp value={key} onChange={e=>{setKey(e.target.value.toUpperCase());setErr("");}} placeholder="ABCD-1234"/>
          {err&&<p style={{color:"#D94F3D",fontSize:13,margin:"6px 0 0"}}>{err}</p>}
          <div style={{display:"flex",gap:10,marginTop:14}}>
            <button onClick={()=>{setJoining(false);setKey("");}} style={{
              flex:1,padding:"13px",borderRadius:14,border:"1.5px solid var(--border)",
              background:"transparent",color:"var(--text2)",fontSize:15,fontWeight:600,fontFamily:"inherit"}}>
              Back
            </button>
            <Btn color={BRAND.slate} onClick={()=>{
              if(/^[A-Z]{4}-[0-9]{4}$/.test(key)) onJoin(key);
              else setErr("Invalid key format (e.g. ABCD-1234)");
            }}>Join</Btn>
          </div>
        </div>
      )}
      <p style={{marginTop:48,color:"var(--text3)",fontSize:12,textAlign:"center"}}>
        No account needed · Anonymous sync · Private
      </p>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────
function App(){
  const [darkMode,  setDarkMode]  = useState(()=>load("tb_dark",true));
  const [screen,    setScreen]    = useState("home");
  const [onboarded, setOnboarded] = useState(()=>load("tb_onboarded",false));
  const [syncKey,   setSyncKey]   = useState(()=>load("tb_synckey",""));
  const [cats,      setCats]      = useState(()=>load("tb_cats",DEF_CATS));
  const [chores,    setChores]    = useState(()=>load("tb_chores",DEF_CHORES));
  const [comps,     setComps]     = useState(()=>load("tb_comps",[]));
  const [members,   setMembers]   = useState(()=>load("tb_members",[]));
  const [activeMId, setActiveMId] = useState(()=>load("tb_activeM",""));
  const [fbUrl,     setFbUrl]     = useState(()=>load("tb_fbUrl",""));
  const [isWide,    setIsWide]    = useState(window.innerWidth>=768);

  useEffect(()=>{
    const h=()=>setIsWide(window.innerWidth>=768);
    window.addEventListener("resize",h);
    return ()=>window.removeEventListener("resize",h);
  },[]);
  useEffect(()=>{save("tb_dark",     darkMode);},[darkMode]);
  useEffect(()=>{save("tb_cats",     cats);},[cats]);
  useEffect(()=>{save("tb_chores",   chores);},[chores]);
  useEffect(()=>{save("tb_comps",    comps);},[comps]);
  useEffect(()=>{save("tb_members",  members);},[members]);
  useEffect(()=>{save("tb_activeM",  activeMId);},[activeMId]);
  useEffect(()=>{save("tb_fbUrl",    fbUrl);},[fbUrl]);

  // Firebase sync
  const lastFbSnap = useRef(null);
  const saveTimer  = useRef(null);
  const [syncSt,setSyncSt] = useState(fbUrl&&syncKey?"idle":"offline");

  // SSE real-time listener — initial load + live updates
  useEffect(()=>{
    if(!fbUrl||!syncKey){setSyncSt("offline");return;}
    setSyncSt("idle");
    const url=fbUrl.replace(/[/]$/,"")+"/households/"+syncKey+".json";
    let es=null;
    try{
      es=new EventSource(url);
      es.addEventListener("put",e=>{
        try{
          const parsed=JSON.parse(e.data);
          const data=parsed&&parsed.data;
          if(!data) return;
          const inc={
            cats:    Array.isArray(data.cats)?    data.cats    : cats,
            chores:  Array.isArray(data.chores)?  data.chores  : chores,
            comps:   Array.isArray(data.comps)?   data.comps   : comps,
            members: Array.isArray(data.members)? data.members : members,
          };
          // Store BEFORE state updates so auto-save sees no diff
          lastFbSnap.current=JSON.stringify(inc);
          setCats(inc.cats);
          setChores(inc.chores);
          setComps(inc.comps);
          setMembers(inc.members);
          setSyncSt("idle");
        }catch(err){}
      });
      es.onerror=()=>setSyncSt("error");
    }catch(err){setSyncSt("error");}
    return()=>{try{if(es)es.close();}catch(err){}setSyncSt("offline");};
  },[fbUrl,syncKey]);

  // Auto-save debounce — skips echoing data that came from Firebase
  useEffect(()=>{
    if(!fbUrl||!syncKey) return;
    const snapshot={cats,chores,comps,members};
    const snap=JSON.stringify(snapshot);
    if(lastFbSnap.current!==null&&snap===lastFbSnap.current) return;
    setSyncSt("saving");
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      try{
        await cloudSave(fbUrl,syncKey,snapshot);
        lastFbSnap.current=snap;
        setSyncSt("saved");
        setTimeout(()=>setSyncSt("idle"),2500);
      }catch(e){setSyncSt("error");}
    },1500);
    return()=>{if(saveTimer.current) clearTimeout(saveTimer.current);};
  },[cats,chores,comps,members]);

  const handleCreate=()=>{
    const k=genKey();setSyncKey(k);save("tb_synckey",k);
    setOnboarded(true);save("tb_onboarded",true);
  };
  const handleJoin=k=>{
    setSyncKey(k);save("tb_synckey",k);
    setOnboarded(true);save("tb_onboarded",true);
  };

  const dm=darkMode;
  const cssV=dm?{
    "--bg1":"#0D0F14","--bg2":"#171A22","--bg3":"#21252F",
    "--border":"#2A2F3D","--text1":"#EEF0F8","--text2":"#8890A8",
    "--text3":"#4A5068","--accent":"#E8735A",
  }:{
    "--bg1":"#F5F0E8","--bg2":"#FFFFFF","--bg3":"#EDE8E0",
    "--border":"#E2DDD5","--text1":"#1A1612","--text2":"#6B6560",
    "--text3":"#A09A94","--accent":"#E8735A",
  };

  if(!onboarded) return (
    <div style={{...cssV,background:"var(--bg1)",height:"100%"}}>
      <Onboarding onCreate={handleCreate} onJoin={handleJoin}/>
    </div>
  );

  const sp={syncKey,setSyncKey,darkMode:dm,setDarkMode,members,setMembers,
    activeMId,setActiveMId,isWide,fbUrl,setFbUrl,cats,setCats,chores,setChores,comps,setComps,syncSt,setSyncSt};

  return (
    <div style={{...cssV,background:"var(--bg1)",height:"100%",
      display:"flex",overflow:"hidden",
      fontFamily:"-apple-system,'SF Pro Display','Helvetica Neue',sans-serif"}}>

      {isWide&&(
        <Sidebar screen={screen} setScreen={setScreen} syncKey={syncKey}
          members={members} activeMId={activeMId} setActiveMId={setActiveMId}
          darkMode={dm} setDarkMode={setDarkMode}/>
      )}

      <div style={{flex:1,overflowY:"auto",minWidth:0}}>
        {screen==="home"       &&<Home chores={chores} cats={cats} comps={comps} setComps={setComps}
          darkMode={dm} setDarkMode={setDarkMode} isWide={isWide} members={members} activeMId={activeMId} syncSt={syncSt}/>}
        {screen==="history"    &&<History chores={chores} comps={comps} cats={cats} isWide={isWide} members={members}/>}
        {screen==="categories" &&<Categories cats={cats} setCats={setCats} chores={chores} isWide={isWide}/>}
        {screen==="chores"     &&<ChoresScreen chores={chores} setChores={setChores} cats={cats} isWide={isWide}/>}
        {screen==="settings"   &&<Settings {...sp}/>}
      </div>

      {!isWide&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,
          background:dm?"rgba(13,15,20,.95)":"rgba(245,240,232,.95)",
          backdropFilter:"blur(20px)",borderTop:"1px solid var(--border)",
          display:"flex",padding:"8px 0",zIndex:50}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setScreen(n.id)} style={{
              flex:1,display:"flex",flexDirection:"column",alignItems:"center",
              gap:3,background:"none",border:"none",padding:"4px 0"}}>
              <span style={{fontSize:21,lineHeight:1,
                filter:screen===n.id?"none":"grayscale(1) opacity(.5)"}}>{n.icon}</span>
              <span style={{fontSize:10,fontWeight:700,letterSpacing:".03em",
                color:screen===n.id?BRAND.coral:"var(--text3)"}}>{n.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
